name: Sync Public Email Provider List

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: dev
          fetch-depth: 1

      - name: Fetch gist and convert to JSON array
        run: |
          curl -fsSL "https://gist.githubusercontent.com/ammarshah/f5c2624d767f91a7cbdc4e54db8dd0bf/raw/all_email_provider_domains.txt" \
            | grep -v '^\s*$' \
            | jq -R . \
            | jq -s . \
            > /tmp/public-email-provider-list.json

      - name: Compare with existing file
        id: compare
        run: |
          if [ ! -f public-email-provider-list.json ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif diff -q public-email-provider-list.json /tmp/public-email-provider-list.json > /dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: No changes detected
        if: steps.compare.outputs.changed == 'false'
        run: echo "List is up to date. No PR needed."

      - name: Create source-update branch and push changes
        if: steps.compare.outputs.changed == 'true'
        run: |
          cp /tmp/public-email-provider-list.json public-email-provider-list.json
          git config user.name "VH-Devops GitHub Actions[bot]"
          git config user.email "devops@ventrichealth.com"
          git checkout -b source-update
          git add public-email-provider-list.json
          git commit -m "(chore): sync public email provider list from upstream gist"
          git push --force origin source-update

      - name: Create pull request into dev
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: source-update
          base: dev
          commit-message: "chore: sync public email provider list from upstream gist"
          title: "chore: sync public email provider list"
          body: |
            Automated update from upstream gist:
            https://gist.github.com/ammarshah/f5c2624d767f91a7cbdc4e54db8dd0bf

            This PR was created automatically by the sync workflow.
          delete-branch: true